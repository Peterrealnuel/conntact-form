<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Contact form</title>

    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="contact-form">
        <div class="form-title">
          <h1>Contact Us</h1>
        </div>

        <form action="https://formsubmit.co/emmanueljesutofunmi@gmail.com" method="post">
          <div class="name-fields">
            <div class="form-group">
              <label for="first-name"> First Name <span>*</span> </label>
              <input type="text" id="firstname" name="firstname" required />
            </div>

            <div class="form-group">
              <label for="last-name"> Last Name <span>*</span> </label>
              <input type="text" id="lastname" name="lastname" required />
            </div>
          </div>

          <div class="form-group email-group">
            <label for="email"> Email Address <span>*</span> </label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group query-group">
            <label>Query Type <span>*</span></label>
            <div class="query-options">
              <div class="query-option">
                <input
                  type="radio"
                  id="general"
                  name="querytype"
                  value="general"
                />
                <label for="general">General Enquiry</label>
              </div>
              <div class="query-option">
                <input
                  type="radio"
                  id="support"
                  name="querytype"
                  value="support"
                />
                <label for="support">Support Request</label>
              </div>
            </div>
          </div>
          <div class="form-group message-group">
            <label for="message"> Message <span>*</span> </label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <div class="consent-group">
            <input type="checkbox" id="consent" name="consent" required />
            <label for="consent">
              I consent to being contacted by the team
              <span>*</span>
            </label>
          </div>
          <div class="submitgroup">
            <input type="submit" id="submit">
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
